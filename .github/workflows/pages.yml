name: Deploy RANDOM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Regenera a diario las páginas permanentes, sitemap y galerías.
    - cron: "17 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate permanent edition pages, galleries and sitemap
        run: python3 scripts/build_archive.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy RANDOM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Regenera a diario las páginas permanentes, sitemap y galerías.
    - cron: "17 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache remote gallery images
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .cache/eleventy-img
          key: gallery-images-${{ runner.os }}-${{ hashFiles('docs/gallery.json') }}
          restore-keys: |
            gallery-images-${{ runner.os }}-
      - name: Install image optimizer
        continue-on-error: true
        run: npm install --no-save --no-package-lock @11ty/eleventy-img@7.0.0
      - name: Build responsive gallery images
        run: |
          if node scripts/build_gallery_images.mjs; then
            cp .cache/gallery.generated.json docs/gallery.json
            echo "Galería optimizada generada correctamente."
          else
            echo "La optimización falló; se publica la galería con las imágenes originales de Drive."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate permanent edition pages, galleries and sitemap
        run: python3 scripts/build_archive.py
      - name: Refresh gallery client cache key
        run: |
          find docs/ediciones docs/galeria -name index.html -type f -exec \
            sed -i 's/gallery.js?v=20260818-2/gallery.js?v=20260818-3/g' {} +
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
